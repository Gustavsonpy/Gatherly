name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: "9.0.x"
  NODE_VERSION: "20.x"
  SOLUTION_PATH: "./Gatherly.slnx"
  BACKEND_PROJECT_PATH: "./API/API.csproj"
  BACKEND_DIR: "./API"
  TEST_PROJECT_PATH: "./Tests/API.Tests"
  FRONTEND_DIR: "./frontend"

jobs:
  # ----------------------------------------------------------------
  # BACKEND: build + test the ASP.NET Core API
  # ----------------------------------------------------------------
  backend:
    name: Backend (.NET) - Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release

      - name: Run tests
        run: dotnet test ${{ env.TEST_PROJECT_PATH }} --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ./TestResults

      - name: Publish
        if: github.ref == 'refs/heads/main'
        run: dotnet publish ${{ env.BACKEND_PROJECT_PATH }} --no-build --configuration Release --output ./publish/backend

      - name: Upload backend artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: ./publish/backend

  # ----------------------------------------------------------------
  # FRONTEND: lint + test + build the Angular app
  # ----------------------------------------------------------------
  frontend:
    name: Frontend (Angular) - Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Lint
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run lint --if-present

      - name: Run unit tests (headless)
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run test -- --watch=false --browsers=ChromeHeadless --no-progress

      - name: Build (production)
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build -- --configuration production

      - name: Upload frontend artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ${{ env.FRONTEND_DIR }}/dist

  # ----------------------------------------------------------------
  # DOCKER: valida que as imagens de produção (backend + frontend)
  # realmente buildam a partir dos Dockerfiles usados no docker-compose
  # ----------------------------------------------------------------
  docker-build:
    name: Docker - Validate images
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BACKEND_DIR }}
          push: false
          tags: gatherly-api:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.FRONTEND_DIR }}
          push: false
          tags: gatherly-frontend:ci