<main class="flex min-h-dvh justify-center items-center bg-[#7C3AED]">
  <div id="form-container" class="flex justify-center items-center rounded-2xl w-3/5 h-150 bg-[white]">
      <section id="form-content" class="flex flex-col justify-center gap-10 w-[90%] h-[90%]">
        <div id="logo" class="flex items-center">
          <img src="images/logos/logo_gatherly.png" class="w-20 h-20" alt="Logo Gatherly">
          <h1 class="font-bold">Gatherly</h1>
        </div>
        <h1 class="w-full flex justify-center items-center font-bold text-4xl">Fazer login</h1>
        <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-10">
          <div id="form-inputs" class="flex flex-col">
            <generic-input
                id="email-input"
                type="email"
                label="E-mail"
                [control]="form.controls.email"
                placeholder="exemplo@email.com"
              />
            <generic-input
                id="password-input"
                type="password"
                label="Senha"
                [control]="form.controls.password"
                placeholder="Mínimo 6 caracteres"
              />
              <span class="text-red-500 text-[12px]">{{ errorMessage() ??  errorMessage()}}</span>
          </div>

          <div id="util-links" class="flex justify-between w-full">
            <a href="#" class="text-[#5B21B6] underline">Esqueci a senha</a>
            <a href="/register" class="text-[#5B21B6] underline">Ainda não possui uma conta?</a>
          </div>
          <generic-button type="submit" [disabled]="loading()">
            {{ loading() ? 'Entrando' : 'Fazer login' }}
          </generic-button>
        </form>
      </section>
  </div>
</main>
