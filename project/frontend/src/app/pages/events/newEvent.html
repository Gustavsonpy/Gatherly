<main class="flex min-h-dvh bg-white">
    <app-sidebar />
    <section id="content" class="flex flex-1 flex-col p-6">
        <div id="title-container" class="flex flex-col">
            <h2 class="font-bold">Criar evento</h2>
            <span class="text-[12px] text-gray-400">
                Preencha os detalhes para criar o seu evento
            </span>
        </div>

        <div id="form-container" class="flex grow w-full justify-center items-center">
            <form id="form-inputs" class="border border-[#5B21B6] rounded-xl w-[50%] h-full p-5">
                <generic-input
                    id="event-name"
                    label="Nome do evento"
                    [control]="form.controls.eventName"
                />
                <div id="categories-container" class="flex flex-col w-full mb-4.5">
                    <h2>Categoria</h2>
                    <div id="categories" class="flex w-full gap-5">
                        <div id="category" class="border border-[#5B21B6] rounded-sm w-19 h-5"></div>
                        <div id="category" class="border border-[#5B21B6] rounded-sm w-19 h-5"></div>
                        <div id="category" class="border border-[#5B21B6] rounded-sm w-19 h-5"></div>
                        <div id="category" class="border border-[#5B21B6] rounded-sm w-19 h-5"></div>
                        <div id="category" class="border border-[#5B21B6] rounded-sm w-19 h-5"></div>
                        <div id="category" class="border border-[#5B21B6] rounded-sm w-19 h-5"></div>
                        <div id="category" class="border border-[#5B21B6] rounded-sm w-19 h-5"></div>
                        <div id="category" class="border border-[#5B21B6] rounded-sm w-19 h-5"></div>
                    </div>
                </div>
                <div id="description-container" class="flex flex-col h-[15%] mb-4.5">
                    <h2>Descrição</h2>
                    <textarea name="description" id="description" class="border border-[#5B21B6] rounded-sm w-full h-full"></textarea>
                </div>
                <div id="date-time-container" class="flex w-full gap-4">
                    <generic-input
                        class="flex-1 min-w-0"
                        id="date-input"
                        label="Data"
                        [control]="form.controls.date"
                        type="date"
                    />
                    <generic-input
                        class="flex-1 min-w-0"
                        id="time-input"
                        label="Horário"
                        [control]="form.controls.time"
                        type="time"
                    />
                </div>
                <generic-input
                    id="localization-input"
                    label="Local"
                    [control]="form.controls.localization"
                />
                <div id="spot-level-container" class="flex gap-3">
                    <generic-input
                        class="flex-1 min-w-0"
                        id="spot-input"
                        label="Vagas"
                        [control]="form.controls.spots"
                        type="number"
                    />
                    <generic-input
                        class="flex-3 min-w-0"
                        id="level-input"
                        label="Nível"
                        [control]="form.controls.level"
                    />
                </div>
                
                <div class="flex flex-col w-full mb-4.5">
                    <label for="event-image" class="text-sm mb-2">
                        Imagem do evento <span class="text-red-500">*</span>
                    </label>

                    <label
                        for="event-image"
                        class="flex flex-col items-center justify-center
                            w-full h-44
                            bg-[#EDE9FE]
                            border border-dashed border-[#8B5CF6]
                            rounded-md
                            cursor-pointer
                            hover:bg-[#DDD6FE]
                            transition-colors"
                    >
                        <img src="icons/picture.svg" alt="Caricatura logo">

                        <span class="text-xs text-[#5B21B6] mt-2">
                            Clique aqui para adicionar uma imagem
                        </span>
                    </label>

                    <input
                        id="event-image"
                        type="file"
                        accept="image/*"
                        class="hidden"
                    />
                </div>
                <div id="button-container" class="flex gap-3">
                    <generic-button variant="secondary" class="flex-1">Cancelar</generic-button>
                    <generic-button type="submit" class="flex-1">Criar</generic-button>
                </div>
            </form>
        </div>
    </section>
</main>
