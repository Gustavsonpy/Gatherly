<aside class="flex flex-col justify-between items-center w-64 h-dvh sticky top-0 bg-white border-r border-gray-200">
    <section class="flex items-center">
        <img src="images/logos/logo_gatherly.png" class="w-15 h-15" alt="Logo Gatherly">
        <h1>Gatherly</h1>
    </section>
    <section id="mid-container" class="flex flex-col gap-10 w-[70%]">
        <div class="flex flex-col">
            <ul class="flex flex-col gap-5">
                <a routerLink="/homepage" routerLinkActive="bg-primary-light text-primary font-medium" class="flex gap-5 -mx-3 -my-2 px-3 py-2 rounded-lg">
                    <img src="icons/home.svg" alt="Home icon">
                    <li>Home</li>
                </a>
                <a routerLink="/events" routerLinkActive="bg-primary-light text-primary font-medium" class="flex gap-5 -mx-3 -my-2 px-3 py-2 rounded-lg">
                    <img src="icons/calendar-sm.svg" alt="Evento icon">
                    <li>Eventos</li>
                </a>
                <a routerLink="/my-events" routerLinkActive="bg-primary-light text-primary font-medium" class="flex gap-5 -mx-3 -my-2 px-3 py-2 rounded-lg">
                    <img src="icons/user.svg" alt="Meus eventos icon">
                    <li>Meus eventos</li>
                </a>
                <a routerLink="/history" routerLinkActive="bg-primary-light text-primary font-medium" class="flex gap-5 -mx-3 -my-2 px-3 py-2 rounded-lg">
                    <img src="icons/historico.svg" alt="Histórico icon">
                    <li>Histórico</li>
                </a>
                <a href="/settings" class="flex gap-5">
                    <img src="icons/configuracao.svg" alt="Configuraçao icon">
                    <li>Configurações</li>
                </a>
            </ul>
        </div>
        <a href="/newEvent"><generic-button>Criar evento</generic-button></a>
    </section>
    <section id="bottom-part" class="flex flex-col gap-5">
        <p>{{ username() }}</p>
        <div id="view-mode" class="flex items-center justify-center gap-3">
            <img src="icons/lua.svg" alt="modo escuro icon">
            <span>Modo escuro</span>
        </div>
    </section>
</aside>
