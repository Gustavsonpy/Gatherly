<!-- Barra superior: aparece só no celular (some a partir de md) -->
<header class="md:hidden sticky top-0 z-30 flex items-center justify-between h-14 px-4 bg-white border-b border-gray-200">
    <button type="button" (click)="toggleMenu()" aria-label="Abrir menu" [attr.aria-expanded]="menuOpen()"
            class="p-2 -ml-2 rounded-lg cursor-pointer hover:bg-gray-100">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
    </button>
    <a routerLink="/homepage" class="flex items-center gap-1">
        <img src="images/logos/logo_gatherly.png" class="w-9 h-9" alt="Logo Gatherly">
        <span class="font-medium">Gatherly</span>
    </a>
    <img src="{{ userPhoto() }}" alt="" class="w-8 h-8 rounded-full object-cover bg-black">
</header>

<!-- Fundo escuro atrás do menu aberto no celular; clicar fecha o menu -->
@if (menuOpen()) {
    <div class="md:hidden fixed inset-0 z-40 bg-black/40" (click)="closeMenu()"></div>
}

<!--
    Celular: menu lateral fixo, escondido fora da tela (-translate-x-full) até abrir.
    A partir de md: volta a ser a sidebar fixa ao lado do conteúdo.
-->
<aside class="fixed inset-y-0 left-0 z-50 flex flex-col justify-between items-center w-64 py-4 bg-white border-r border-gray-200
              transition-transform duration-200 md:sticky md:top-0 md:h-dvh md:translate-x-0 md:z-auto"
       [class.-translate-x-full]="!menuOpen()">
    <section class="flex items-center">
        <img src="images/logos/logo_gatherly.png" class="w-15 h-15" alt="Logo Gatherly">
        <h1>Gatherly</h1>
    </section>
    <section id="mid-container" class="flex flex-col gap-10 w-[70%]">
        <div class="flex flex-col">
            <ul class="flex flex-col gap-5">
                <a routerLink="/homepage" routerLinkActive="bg-primary-light text-primary font-medium" class="flex gap-5 -mx-3 -my-2 px-3 py-2 rounded-lg" (click)="closeMenu()">
                    <img src="icons/home.svg" alt="Home icon">
                    <li>Home</li>
                </a>
                <a routerLink="/events" routerLinkActive="bg-primary-light text-primary font-medium" class="flex gap-5 -mx-3 -my-2 px-3 py-2 rounded-lg" (click)="closeMenu()">
                    <img src="icons/calendar-sm.svg" alt="Evento icon">
                    <li>Eventos</li>
                </a>
                <a routerLink="/my-events" routerLinkActive="bg-primary-light text-primary font-medium" class="flex gap-5 -mx-3 -my-2 px-3 py-2 rounded-lg" (click)="closeMenu()">
                    <img src="icons/user.svg" alt="Meus eventos icon">
                    <li>Meus eventos</li>
                </a>
                <a routerLink="/history" routerLinkActive="bg-primary-light text-primary font-medium" class="flex gap-5 -mx-3 -my-2 px-3 py-2 rounded-lg" (click)="closeMenu()">
                    <img src="icons/historico.svg" alt="Histórico icon">
                    <li>Histórico</li>
                </a>
                <a routerLink="/settings" routerLinkActive="bg-primary-light text-primary font-medium" class="flex gap-5 -mx-3 -my-2 px-3 py-2 rounded-lg" (click)="closeMenu()">
                    <img src="icons/configuracao.svg" alt="Configuraçao icon">
                    <li>Configurações</li>
                </a>
            </ul>
        </div>
        <a routerLink="/newEvent" (click)="closeMenu()"><generic-button>Criar evento</generic-button></a>
    </section>
    <section id="bottom-part" class="flex flex-col gap-5">
        <div id="user-info">
            <div class="flex items-center gap-3">
                <img src="{{ userPhoto() }}" alt="user photo"
                    class="w-11 h-11 rounded-full object-cover bg-black border-2 border-gray-50">
                <p>{{ usernamee() }}</p>    
            </div>
        </div>
        <div id="view-mode" class="flex items-center justify-center gap-3">
            <img src="icons/lua.svg" alt="modo escuro icon">
            <span>Modo escuro</span>
        </div>
    </section>
</aside>
