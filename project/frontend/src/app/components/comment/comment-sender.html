<div id="send-message" class="flex gap-5 justify-center items-center h-full w-full">
    <textarea
        [formControl]="commentControl"
        class="border border-primary-dark rounded-sm w-full h-full p-2 text-[12px]">
    </textarea>
    <button 
        type="button"
        (click)="send()"
        [disabled]="commentControl.invalid || sending()"
        class="border border-black w-10 h-full flex justify-center items-center rounded-md cursor-pointer">
        <img src="icons/send-sm.svg" alt="">
    </button>
</div>
