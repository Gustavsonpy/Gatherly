
name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22.x"
  SOLUTION_PATH: "./project/Gatherly.slnx"
  BACKEND_PROJECT_PATH: "./project/API/API.csproj"
  BACKEND_DIR: "./project/API"
  TEST_PROJECT_PATH: "./project/Tests/API.Tests"
  FRONTEND_DIR: "./project/frontend"

jobs:
  # ----------------------------------------------------------------
  # BACKEND: build + test + SonarQube analysis
  # ----------------------------------------------------------------
  backend:
    name: Backend (.NET) - Build, Test & SonarQube
    runs-on: ubuntu-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Add .NET tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: SonarQube - Begin Analysis
        run: |
          dotnet sonarscanner begin \
            /k:"Gustavsonpy_Gatherly" \
            /o:"gustavsonpy" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.scanner.scanAll=true \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" \
            /d:sonar.javascript.lcov.reportPaths="project/frontend/coverage/frontend/lcov.info" \
            /d:sonar.coverage.exclusions="**/Migrations/**,project/Tests/**,**/*.spec.ts"

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release --no-incremental

      - name: Run tests
        run: dotnet test ${{ env.TEST_PROJECT_PATH }} --no-build --configuration Release --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci --ignore-scripts

      - name: Frontend coverage
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          npm run test:coverage
          sed -i 's#^SF:#SF:project/frontend/#' coverage/frontend/lcov.info

      - name: SonarQube - End Analysis
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ./TestResults

      - name: Publish
        if: github.ref == 'refs/heads/main'
        run: dotnet publish ${{ env.BACKEND_PROJECT_PATH }} --no-build --configuration Release --output ./publish/backend

      - name: Create deployment ZIP
        if: github.ref == 'refs/heads/main'
        run: |
          cd ./publish/backend
          zip -r ../backend.zip .

      - name: Upload backend artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: ./publish/backend.zip

  # ----------------------------------------------------------------
  # FRONTEND: lint + test + build the Angular app
  # ----------------------------------------------------------------
  frontend:
    name: Frontend (Angular) - Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci --ignore-scripts

      - name: Lint
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run lint --if-present

      - name: Run unit tests (Vitest + jsdom)
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run test -- --watch=false

      - name: Build (production)
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build -- --configuration production

      - name: Upload frontend artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ${{ env.FRONTEND_DIR }}/dist

  # ----------------------------------------------------------------
  # DOCKER: validate production images
  # ----------------------------------------------------------------
  docker-build:
    name: Docker - Validate images
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BACKEND_DIR }}
          push: false
          tags: gatherly-api:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.FRONTEND_DIR }}
          push: false
          tags: gatherly-frontend:ci

  # ----------------------------------------------------------------
  # DEPLOY: publish API automatically to Azure App Service
  # ----------------------------------------------------------------
  deploy-backend:
    name: Deploy Backend to Azure
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-publish
          path: ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: gatherly-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish/backend.zip
