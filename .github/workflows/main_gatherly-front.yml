
name: Build and deploy Angular app to Azure Web App - gatherly-front

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: project/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: project/frontend

      - name: Run tests
        run: npm run test -- --watch=false
        working-directory: project/frontend

      - name: Build Angular app
        run: npm run build -- --configuration production
        working-directory: project/frontend

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: project/frontend/dist/frontend/browser
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D1DADC304A0946E8A57F734A74BC0AE9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C4AF539E82414918A502950874328267 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5645846F3B60469C8B4125DF19934129 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: 'gatherly-front'
          slot-name: 'Production'
          package: .
